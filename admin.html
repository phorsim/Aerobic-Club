<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Aerobic Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --purple: #713be5;
      --pink: #fa579b;
      --light: #f7f0ff;
      --ink: #25213b;
      --muted: #777;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #fffaff;
      color: var(--ink);
      font-family: 'Poppins', sans-serif;
    }

    [hidden] {
      display: none !important;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 8%;
      background: white;
      box-shadow: 0 2px 15px #0000000c;
    }

    header a {
      color: var(--purple);
      font-weight: 700;
      text-decoration: none;
    }

    main {
      width: min(100% - 32px, 1000px);
      margin: 55px auto;
    }

    .panel {
      padding: 30px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 8px 30px #0000000c;
    }

    .login-panel {
      width: min(100%, 460px);
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .intro,
    .status {
      color: var(--muted);
      line-height: 1.7;
    }

    form {
      display: grid;
      gap: 14px;
      margin-top: 24px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #e6deef;
      border-radius: 10px;
      font: inherit;
    }

    button {
      padding: 13px 20px;
      border: 0;
      border-radius: 28px;
      background: linear-gradient(90deg, var(--purple), var(--pink));
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: .7;
    }

    .dashboard-heading {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
    }

    .dashboard-heading p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    .secondary-button {
      flex: 0 0 auto;
      background: var(--light);
      color: var(--purple);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid #eee8f5;
      border-radius: 12px;
    }

    table {
      width: 100%;
      min-width: 720px;
      border-collapse: collapse;
      text-align: left;
    }

    th,
    td {
      padding: 13px 15px;
      border-bottom: 1px solid #eee8f5;
      vertical-align: top;
    }

    th {
      background: var(--light);
      color: var(--purple);
      font-size: 13px;
    }

    td {
      font-size: 14px;
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .status {
      min-height: 24px;
      margin: 14px 0 0;
    }

    @media(max-width: 600px) {
      header {
        padding: 16px 5%;
      }

      main {
        margin: 30px auto;
      }

      .panel {
        padding: 22px 18px;
      }

      .dashboard-heading {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <header>
    <a href="index.html">💜 AEROBIC CLUB</a>
    <a href="index.html#join">Join the club</a>
  </header>

  <main>
    <section class="panel login-panel" id="loginPanel">
      <h1>Administrator Login</h1>
      <p class="intro">Sign in with an authorized club administrator account to view registrations.</p>
      <form id="loginForm">
        <input id="email" type="email" placeholder="Admin email" autocomplete="username" required>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button id="loginButton" type="submit">Sign in</button>
      </form>
      <p class="status" id="loginStatus" role="status" aria-live="polite"></p>
    </section>

    <section class="panel" id="dashboard" hidden>
      <div class="dashboard-heading">
        <div>
          <h1>Member Registrations</h1>
          <p id="adminEmail"></p>
        </div>
        <button class="secondary-button" id="logoutButton" type="button">Sign out</button>
      </div>
      <p class="status" id="dashboardStatus" role="status" aria-live="polite"></p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Favorite activity</th>
              <th>Submitted</th>
            </tr>
          </thead>
          <tbody id="registrationRows"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const loginPanel = document.getElementById("loginPanel");
    const loginForm = document.getElementById("loginForm");
    const loginButton = document.getElementById("loginButton");
    const loginStatus = document.getElementById("loginStatus");
    const dashboard = document.getElementById("dashboard");
    const dashboardStatus = document.getElementById("dashboardStatus");
    const rows = document.getElementById("registrationRows");

    const supabaseConfigured = Boolean(
      window.AEROBIC_SUPABASE_URL &&
      !window.AEROBIC_SUPABASE_URL.includes("YOUR_") &&
      window.AEROBIC_SUPABASE_ANON_KEY &&
      !window.AEROBIC_SUPABASE_ANON_KEY.includes("YOUR_") &&
      window.supabase
    );

    const supabaseClient = supabaseConfigured
      ? window.supabase.createClient(
        window.AEROBIC_SUPABASE_URL,
        window.AEROBIC_SUPABASE_ANON_KEY
      )
      : null;

    function setLoginStatus(message) {
      loginStatus.textContent = message;
    }

    function makeCell(value) {
      const cell = document.createElement("td");
      cell.textContent = value;
      return cell;
    }

    async function loadRegistrations() {
      dashboardStatus.textContent = "Loading registrations...";
      rows.replaceChildren();

      const registrations = [];
      const pageSize = 500;

      for (let offset = 0; ; offset += pageSize) {
        const { data, error } = await supabaseClient
          .from("registrations")
          .select("name, email, phone, activity, created_at, id")
          .order("created_at", { ascending: false })
          .order("id", { ascending: false })
          .range(offset, offset + pageSize - 1);

        if (error) {
          throw error;
        }

        registrations.push(...data);
        if (data.length < pageSize) {
          break;
        }
      }

      for (const registration of registrations) {
        const row = document.createElement("tr");
        row.append(
          makeCell(registration.name),
          makeCell(registration.email),
          makeCell(registration.phone),
          makeCell(registration.activity),
          makeCell(new Date(registration.created_at).toLocaleString())
        );
        rows.appendChild(row);
      }

      dashboardStatus.textContent = registrations.length
        ? registrations.length + " registration" + (registrations.length === 1 ? "" : "s")
        : "No registrations yet.";
    }

    async function openDashboard(user) {
      if (user.app_metadata.role !== "admin") {
        await supabaseClient.auth.signOut();
        dashboard.hidden = true;
        loginPanel.hidden = false;
        setLoginStatus("This account is not authorized to view registrations.");
        return;
      }

      loginPanel.hidden = true;
      dashboard.hidden = false;
      document.getElementById("adminEmail").textContent = "Signed in as " + user.email;

      try {
        await loadRegistrations();
      } catch (error) {
        console.error("Could not load registrations:", error);
        dashboardStatus.textContent = "Could not load registrations. Please try signing in again.";
      }
    }

    loginForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!supabaseClient) {
        setLoginStatus("Admin login is not configured. Set up Supabase in supabase-config.js first.");
        return;
      }

      loginButton.disabled = true;
      setLoginStatus("Signing in...");

      try {
        const { data, error } = await supabaseClient.auth.signInWithPassword({
          email: document.getElementById("email").value.trim(),
          password: document.getElementById("password").value
        });

        if (error) {
          throw error;
        }

        await openDashboard(data.user);
      } catch (error) {
        console.error("Admin sign-in failed:", error);
        setLoginStatus("Sign-in failed. Check your email and password, then try again.");
      } finally {
        loginButton.disabled = false;
      }
    });

    document.getElementById("logoutButton").addEventListener("click", async function () {
      this.disabled = true;

      try {
        const { error } = await supabaseClient.auth.signOut();
        if (error) {
          throw error;
        }

        dashboard.hidden = true;
        loginPanel.hidden = false;
        loginForm.reset();
        setLoginStatus("You have signed out.");
      } catch (error) {
        console.error("Admin sign-out failed:", error);
        dashboardStatus.textContent = "Could not sign out. Please try again.";
      } finally {
        this.disabled = false;
      }
    });

    async function restoreSession() {
      if (!supabaseClient) {
        setLoginStatus("Admin login is not configured. Set up Supabase in supabase-config.js first.");
        loginButton.disabled = true;
        return;
      }

      try {
        const { data, error } = await supabaseClient.auth.getSession();
        if (error) {
          throw error;
        }

        if (data.session) {
          await openDashboard(data.session.user);
        }
      } catch (error) {
        console.error("Could not restore admin session:", error);
        setLoginStatus("Could not connect to the admin service. Please try again later.");
      }
    }

    restoreSession();
  </script>
</body>

</html>
